[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vo-coach"
version = "0.1.0"
description = "AI voiceover coach & mastering agent"
requires-python = ">=3.12,<3.13"

[project.scripts]
vo-coach = "vo_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
